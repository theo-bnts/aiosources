name: Promote stable image

on:
  release:
    types: [released]

permissions:
  contents: read
  packages: write

concurrency:
  group: stable-images
  cancel-in-progress: false

jobs:
  promote:
    if: github.event.release.prerelease == false && github.event.release.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested release
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Validate release image record
        id: image
        run: python3 tools/release_channels.py promotion --revision "$GITHUB_SHA" --event "$GITHUB_EVENT_PATH" --output "$GITHUB_OUTPUT"
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify both architectures and promote the exact tested image
        env:
          GHCR_IMAGE: ${{ steps.image.outputs.ghcr }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          RELEASE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          docker buildx imagetools inspect "$GHCR_IMAGE@$IMAGE_DIGEST" --raw > "$RUNNER_TEMP/manifest.json"
          python3 - "$RUNNER_TEMP/manifest.json" <<'PY'
          import json, sys
          with open(sys.argv[1]) as source:
              manifest = json.load(source)
          platforms = {(p.get('os'), p.get('architecture')) for item in manifest.get('manifests', []) for p in [item.get('platform', {})] if p.get('os') == 'linux'}
          if platforms != {('linux', 'amd64'), ('linux', 'arm64')}:
              raise SystemExit('The tested image must contain Linux amd64 and arm64.')
          PY
          docker buildx imagetools create --tag "$GHCR_IMAGE:latest" --tag "$GHCR_IMAGE:stable" --tag "$GHCR_IMAGE:$RELEASE_TAG" "$GHCR_IMAGE@$IMAGE_DIGEST"
          actual=$(docker buildx imagetools inspect "$GHCR_IMAGE:latest" --format '{{.Manifest.Digest}}')
          test "$actual" = "$IMAGE_DIGEST"
