name: Tests CI

on:
  workflow_call:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: aiosources
          POSTGRES_PASSWORD: aiosources
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aiosources -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      INGEST_TEST_DATABASE_URL: postgresql://aiosources:aiosources@127.0.0.1:5432/postgres
      INGEST_PG_DUMP: /usr/lib/postgresql/18/bin/pg_dump
      INGEST_PG_RESTORE: /usr/lib/postgresql/18/bin/pg_restore
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            torznab/go.sum
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install PostgreSQL 18 backup tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-common ca-certificates
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-18
          "$INGEST_PG_DUMP" --version | grep -E '\(PostgreSQL\) 18\.'
          "$INGEST_PG_RESTORE" --version | grep -E '\(PostgreSQL\) 18\.'
      - name: Install frontend dependencies
        run: npm --prefix web ci --no-audit --no-fund
      - name: Build embedded application
        run: make build VERSION=2.0.0
      - name: Tests with race detection
        run: |
          go test -race -count=1 ./...
          go -C torznab test -race -count=1 ./...
      - name: Install browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Browser regressions
        run: make e2e
      - name: Compile both Linux architectures
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags production -trimpath -o /tmp/aiosource-amd64 ./cmd/ingest
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -tags production -trimpath -o /tmp/aiosource-arm64 ./cmd/ingest
