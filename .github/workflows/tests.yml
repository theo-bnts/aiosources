name: Tests CI

on:
  workflow_call:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: aiosources
          POSTGRES_PASSWORD: aiosources
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aiosources -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://aiosources:aiosources@127.0.0.1:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            torznab/go.sum
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix web ci --no-audit --no-fund
      - name: Build embedded application
        run: CGO_ENABLED=0 make build
      - name: Tests with race detection
        run: |
          go test -race -count=1 ./...
          go -C torznab test -race -count=1 ./...
      - name: Browser regressions
        env:
          BROWSER_IMAGE: mcr.microsoft.com/playwright:v1.63.0-resolute@sha256:b022639ae9197f864040f92eef7b57c6d4b47db2190f77c909d8a5d902dd4b7e
        run: |
          set -euo pipefail
          playwright_version="$(node -p "require('./web/node_modules/@playwright/test/package.json').version")"
          case "$BROWSER_IMAGE" in
            "mcr.microsoft.com/playwright:v${playwright_version}-resolute@sha256:"*) ;;
            *) echo "::error::The pinned browser image must match the installed Playwright version."; exit 1 ;;
          esac
          docker run --rm --init --network host --shm-size=1g \
            --user "$(id -u):$(id -g)" \
            --env CI=true \
            --env TEST_DATABASE_URL \
            --env HOME=/tmp/aiosources-browser-home \
            --mount "type=bind,source=${GITHUB_WORKSPACE},target=/work" \
            --workdir /work \
            "$BROWSER_IMAGE" \
            sh -c 'mkdir -p "$HOME" && npm --prefix web run e2e'
      - name: Compile both Linux architectures
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags production -trimpath -o /tmp/aiosource-amd64 ./cmd/aiosources
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -tags production -trimpath -o /tmp/aiosource-arm64 ./cmd/aiosources
